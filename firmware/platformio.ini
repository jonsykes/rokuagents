; managents firmware — PlatformIO project
;
;   pio run -e e32r40t -t upload     build and flash the board
;   pio test -e native               run the hardware-independent unit tests on the host
;   pio run -e sim                   build the host renderer (`make screens` runs it)

[platformio]
default_envs = e32r40t

[common]
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
build_unflags =
    -std=gnu++11
    -std=gnu++14
lib_deps =
    bblanchon/ArduinoJson@7.3.2
; One pin for the board and the host renderer, so the screens show the device's pixels.
lovyangfx = lovyan03/LovyanGFX@1.2.30

; LCDWiki 4.0" ESP32-32E display (E32R40T / E32N40T): ESP32-WROOM-32E, ST7796S 320x480 SPI, XPT2046 touch.
[env:e32r40t]
platform = espressif32@7.1.3
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 460800  ; 921600 is unreliable through the CH340C on macOS
build_flags =
    ${common.build_flags}
    -DCORE_DEBUG_LEVEL=0
build_src_flags = -Werror -Wshadow  ; src/ only: warnings in the libraries are not ours to fix
build_unflags = ${common.build_unflags}
lib_deps =
    ${common.lib_deps}
    ${common.lovyangfx}
extra_scripts =
    post:scripts/version.py      ; MANAGENTS_FW_VERSION from git
    post:scripts/merge_image.py  ; managents-firmware-e32r40t.bin, one image to flash at 0x0

; Host-side unit tests for lib/core (no Arduino, no hardware), under AddressSanitizer and UBSan.
[env:native]
platform = native
test_framework = unity
build_flags =
    ${common.build_flags}
    -Werror
    -fsanitize=address,undefined
    -fno-sanitize-recover=all
    -fno-omit-frame-pointer
build_unflags = ${common.build_unflags}
lib_deps = ${common.lib_deps}
lib_compat_mode = off

; Host renderer (docs/adr/0011-host-renderer.md): paints the real UI through LgfxDisplay into
; PNG files and checks the strips against a full-frame paint. sim/headless stands in for SDL.
; No -Wall: LovyanGFX's headers are not warning-clean.
[env:sim]
platform = native
build_flags =
    -std=gnu++17
    -O2                ; at -O0, LovyanGFX 1.2.30 draws a broken QR code (see the ADR)
    -ffp-contract=off  ; no fused multiply-add: the same pixels on every CPU
    -I sim/headless
build_unflags = ${common.build_unflags}
build_src_filter = +<ui/> +<adapters/lgfx_display.cpp> +<../sim/>
lib_deps =
    ${common.lib_deps}
    ${common.lovyangfx}
lib_compat_mode = off
